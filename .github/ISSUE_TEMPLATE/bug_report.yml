name: Bug report
description: Report a reproducible defect in cislunar-sim
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Minimal, reproducible cases help a lot.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest code sample or command sequence that reproduces the problem.
      placeholder: |
        import numpy as np
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Include traceback text, warnings, or surprising output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cislunar-sim version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15, Ubuntu 24.04, Windows 11, ...
    validations:
      required: true
